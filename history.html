
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101810">
  <title>Match History | Turf Wars</title>

  <style>
    :root {
      --bg: #101810;
      --panel: #1b261c;
      --green: #b9f34a;
      --muted: #a9b5a8;
      --line: #354435;
      --white: #f5f8f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      text-align: center;
      padding: 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: var(--green);
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 14px 40px;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 34px);
    }

    .count {
      color: var(--green);
      font-size: 13px;
      margin-top: 7px;
    }

    .refresh {
      background: var(--green);
      color: #14200d;
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 25px 12px;
      line-height: 1.6;
    }

    .match {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .match-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 17px;
    }

    .match-number {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .badge {
      background: #2c3d20;
      color: var(--green);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .team {
      font-size: clamp(15px, 3.7vw, 21px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .vs {
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .score-box {
      background: #111a12;
      border: 1px solid var(--line);
      border-radius: 10px;
      text-align: center;
      padding: 13px 6px;
    }

    .score-team {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .score {
      font-size: 25px;
      font-weight: 900;
    }

    .overs {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .result {
      color: var(--green);
      font-size: 14px;
      line-height: 1.5;
      font-weight: bold;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .actions a {
      display: inline-block;
      text-decoration: none;
      text-align: center;
      border-radius: 9px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: bold;
      flex: 1;
    }

    .live-link {
      background: var(--green);
      color: #14200d;
    }

    .copy-link {
      background: #29372b;
      color: var(--white);
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      padding: 32px 20px;
      line-height: 1.7;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--white);
      font-size: 18px;
      margin-bottom: 8px;
    }

    .hidden { display: none; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 10px 16px 28px;
    }

    @media (max-width: 400px) {
      .match { padding: 14px; }
      .actions a { padding: 11px 8px; }
    }
  </style>
  <link rel="stylesheet" href="./theme.css">
</head>

<body>
<header class="tw-header"><div class="tw-header-inner"><a class="tw-logo" href="./index.html" aria-label="Turf Wars home"><i aria-hidden="true"></i>TURF <b>WARS</b></a><nav class="tw-desktop-nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./scorer.html">Scorer</a><a href="./live.html">Live Score</a><a href="./history.html" aria-current="page">History</a></nav></div></header>
  <header>
    <div class="brand">TURF WARS</div>
    <div class="subtitle">EVERY MATCH. EVERY SCORE.</div>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>Match History</h1>
        <div class="count" id="matchCount">Loading matches...</div>
      </div>
      <button class="refresh" id="refreshButton">Refresh</button>
    </div>

    <div id="status" class="status">Connecting to Turf Wars...</div>
    <div id="matchList"></div>
  </main>

  <footer>Turf Wars · Cricket memories, saved live</footer>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, onValue }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC000ztA_x_KxGnKva4zqBZ7DCwOhQxZQA",
      authDomain: "turf-wars-b6ea0.firebaseapp.com",
      databaseURL: "https://turf-wars-b6ea0-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "turf-wars-b6ea0",
      storageBucket: "turf-wars-b6ea0.firebasestorage.app",
      messagingSenderId: "231555430819",
      appId: "1:231555430819:web:e02b15ad623d62031a8216",
      measurementId: "G-2SVQE2VBKT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const status = document.getElementById("status");
    const matchList = document.getElementById("matchList");
    const matchCount = document.getElementById("matchCount");
    const refreshButton = document.getElementById("refreshButton");

    let allMatches = [];
    let unsubscribe = null;

    function oversFromBalls(balls) {
      const count = Number(balls) || 0;
      return Math.floor(count / 6) + "." + (count % 6);
    }

    function scoreText(innings) {
      if (!innings) return "—";
      return `${innings.runs || 0}/${innings.wickets || 0}`;
    }

    function createElement(tag, className, value) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (value !== undefined) element.textContent = value;
      return element;
    }

    function showEmpty(title, description) {
      status.classList.add("hidden");
      matchList.replaceChildren();

      const box = createElement("div", "empty");
      box.append(
        createElement("strong", "", title),
        createElement("div", "", description)
      );
      matchList.append(box);
    }

    function renderMatches() {
      matchList.replaceChildren();
      status.classList.add("hidden");

      if (allMatches.length === 0) {
        matchCount.textContent = "0 matches";
        showEmpty(
          "No matches yet",
          "Matches saved after this page was created will appear here. Start a match in the scorer to get going."
        );
        return;
      }

      matchCount.textContent =
        `${allMatches.length} match${allMatches.length === 1 ? "" : "es"}`;

      allMatches.forEach(({ id, record }, index) => {
        const match = record.match;
        const names = match.names || ["Team 1", "Team 2"];
        const innings = match.innings || [];
        const finished = match.finished === true;

        const card = createElement("article", "match");

        const top = createElement("div", "match-top");
        top.append(
          createElement("div", "match-number", `Match ${allMatches.length - index}`),
          createElement("span", "badge", finished ? "COMPLETED" : "IN PROGRESS")
        );

        const teams = createElement("div", "teams");
        teams.append(
          createElement("div", "team", names[0] || "Team 1"),
          createElement("div", "vs", "VS"),
          createElement("div", "team", names[1] || "Team 2")
        );

        const scores = createElement("div", "scores");

        [0, 1].forEach((i) => {
          const inn = innings[i];
          const box = createElement("div", "score-box");

          box.append(
            createElement("div", "score-team", names[i] || `Team ${i + 1}`),
            createElement("div", "score", scoreText(inn)),
            createElement(
              "div",
              "overs",
              inn ? `Overs ${oversFromBalls(inn.legalBalls)}` : "Not started"
            )
          );

          scores.append(box);
        });

        const result = createElement(
          "div",
          "result",
          record.message || (finished ? "Match completed." : "Match in progress.")
        );

        const actions = createElement("div", "actions");
        const liveLink = createElement("a", "live-link", "View Scoreboard");
        liveLink.href = new URL(
          `live.html?id=${encodeURIComponent(id)}`,
          window.location.href
        ).href;
        liveLink.target = "_blank";
        liveLink.rel = "noopener";

        const copyLink = createElement("button", "copy-link", "Copy Match Link");
        copyLink.type = "button";
        copyLink.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(liveLink.href);
            copyLink.textContent = "Copied!";
            setTimeout(() => {
              copyLink.textContent = "Copy Match Link";
            }, 1800);
          } catch {
            window.prompt("Copy this match link:", liveLink.href);
          }
        });

        actions.append(liveLink, copyLink);
        card.append(top, teams, scores, result, actions);
        matchList.append(card);
      });
    }

    function loadMatches() {
      if (unsubscribe) unsubscribe();

      status.classList.remove("hidden");
      status.textContent = "Loading matches...";
      matchList.replaceChildren();
      matchCount.textContent = "Loading...";

      unsubscribe = onValue(
        ref(db, "history"),
        (snapshot) => {
          if (!snapshot.exists()) {
            allMatches = [];
            renderMatches();
            return;
          }

          const data = snapshot.val();

          allMatches = Object.entries(data)
            .filter(([, record]) =>
              record &&
              record.public === true &&
              record.match &&
              record.match.names
            )
            .map(([id, record]) => ({ id, record }))
            .sort((a, b) => {
              const aTime = Number(a.record.updatedAt || a.record.createdAt || 0);
              const bTime = Number(b.record.updatedAt || b.record.createdAt || 0);
              return bTime - aTime;
            });

          renderMatches();
        },
        (error) => {
          console.error("History loading error:", error);
          matchCount.textContent = "Unable to load";
          showEmpty(
            "Could not load match history",
            "Firebase may be blocking access to the full match list. Check your database rules and try again."
          );
        }
      );
    }

    refreshButton.addEventListener("click", loadMatches);
    loadMatches();
  </script>

<nav class="tw-mobile-nav" aria-label="Mobile navigation"><a href="./index.html">Home</a><a href="./scorer.html">Scorer</a><a href="./live.html">Live Score</a><a href="./history.html" aria-current="page">History</a></nav>

</body>
</html>
